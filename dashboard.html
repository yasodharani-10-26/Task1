<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f1f5f9;
            min-height: 100vh;
        }


        /* ================================
           NAVBAR
           ================================= */

        .navbar {

            height: 70px;

            background:
                linear-gradient(
                    135deg,
                    #172554,
                    #1e40af
                );

            color: white;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 0 35px;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.15);

        }


        .logo {

            font-size: 22px;

            font-weight: bold;

        }


        .user-info {

            display: flex;

            align-items: center;

            gap: 15px;

        }


        .role-badge {

            padding: 7px 14px;

            border-radius: 20px;

            background: rgba(255,255,255,0.15);

            font-size: 13px;

        }


        .logout-btn {

            border: none;

            padding: 9px 16px;

            border-radius: 8px;

            background: #ef4444;

            color: white;

            cursor: pointer;

            font-weight: 600;

        }


        .logout-btn:hover {

            background: #dc2626;

        }


        /* ================================
           MAIN
           ================================= */

        .main {

            max-width: 1200px;

            margin: 30px auto;

            padding: 0 20px;

        }


        .welcome {

            margin-bottom: 25px;

        }


        .welcome h1 {

            color: #172554;

            margin-bottom: 6px;

        }


        .welcome p {

            color: #64748b;

        }


        /* ================================
           PROFILE CARD
           ================================= */

        .profile-card {

            background: white;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);

        }


        .profile-card h2 {

            color: #172554;

            margin-bottom: 20px;

        }


        .profile-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 15px;

        }


        .profile-item {

            background: #f8fafc;

            padding: 15px;

            border-radius: 10px;

            border: 1px solid #e2e8f0;

        }


        .profile-item .label {

            color: #64748b;

            font-size: 12px;

            margin-bottom: 5px;

        }


        .profile-item .value {

            color: #1e293b;

            font-size: 15px;

            font-weight: 600;

            word-break: break-word;

        }


        /* ================================
           STUDENT TABLE
           ================================= */

        .students-card {

            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);

        }


        .students-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            gap: 15px;

            flex-wrap: wrap;

        }


        .students-header h2 {

            color: #172554;

        }


        .count {

            background: #dbeafe;

            color: #1d4ed8;

            padding: 7px 13px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

        }


        .table-container {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 700px;

        }


        th {

            background: #f1f5f9;

            color: #334155;

            text-align: left;

            padding: 13px;

            font-size: 13px;

        }


        td {

            padding: 13px;

            border-bottom: 1px solid #e2e8f0;

            color: #475569;

            font-size: 14px;

        }


        tr:hover td {

            background: #f8fafc;

        }


        .coding-link {

            color: #2563eb;

            text-decoration: none;

        }


        .coding-link:hover {

            text-decoration: underline;

        }


        /* ================================
           EMPTY
           ================================= */

        .empty {

            text-align: center;

            padding: 40px;

            color: #64748b;

        }


        /* ================================
           LOADING
           ================================= */

        .loading {

            text-align: center;

            padding: 40px;

            color: #64748b;

        }


        /* ================================
           ACCESS DENIED
           ================================= */

        .access-denied {

            background: #fee2e2;

            color: #991b1b;

            padding: 20px;

            border-radius: 10px;

            text-align: center;

            margin-top: 20px;

        }


        /* ================================
           RESPONSIVE
           ================================= */

        @media(max-width: 600px) {

            .navbar {

                padding: 0 15px;

            }


            .logo {

                font-size: 18px;

            }


            .role-badge {

                display: none;

            }


            .main {

                padding: 0 12px;

            }


            .profile-card,
            .students-card {

                padding: 18px;

            }

        }
/* ================================
   STUDENT SEARCH
   ================================= */

.search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin-bottom: 20px;
}

.search-input {
    flex: 1;
    min-width: 200px;
    padding: 11px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
    color: #1e293b;
}

.search-input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.search-btn {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: 600;
}

.search-btn:hover {
    background: #1d4ed8;
}

.clear-search-btn {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    background: #64748b;
    color: white;
    cursor: pointer;
    font-weight: 600;
}

.clear-search-btn:hover {
    background: #475569;
}

.search-result-info {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 12px;
}

@media(max-width: 600px) {
    .search-box {
        flex-direction: column;
        align-items: stretch;
    }

    .search-btn,
    .clear-search-btn {
        width: 100%;
    }
}
    </style>

</head>


<body>


    <!-- ==========================================
         NAVBAR
         =========================================== -->

    <nav class="navbar">

        <div class="logo">

            Academic Management System

        </div>


        <div class="user-info">

            <span
                id="roleBadge"
                class="role-badge"
            >
                Loading...
            </span>


            <button
                id="logoutBtn"
                class="logout-btn"
            >

                Logout

            </button>

        </div>

    </nav>


    <!-- ==========================================
         MAIN
         =========================================== -->

    <main class="main">


        <!-- WELCOME -->

        <div class="welcome">

            <h1 id="welcomeTitle">

                Welcome

            </h1>

            <p id="welcomeDescription">

                Loading your dashboard...

            </p>

        </div>


        <!-- ======================================
             PROFILE
             ======================================= -->

        <div class="profile-card">

            <h2>

                My Profile

            </h2>


            <div
                id="profileGrid"
                class="profile-grid"
            >

                <div class="loading">

                    Loading profile...

                </div>

            </div>

        </div>


        <!-- ======================================
             STUDENTS
             ======================================= -->

        <div
            id="studentsSection"
            class="students-card"
        >

         <div class="students-header">

    <h2 id="studentsTitle">
        Students
    </h2>

    <span id="studentCount" class="count">
        0 Students
    </span>

</div>

<!-- STUDENT SEARCH -->
<div class="search-box">

    <input
        type="text"
        id="studentSearch"
        class="search-input"
        placeholder="Search student by name..."
    >

    <button
        id="searchBtn"
        class="search-btn"
    >
        🔍 Search
    </button>

    <button
        id="clearSearchBtn"
        class="clear-search-btn"
    >
        Clear
    </button>

</div>

<div
    id="searchResultInfo"
    class="search-result-info"
></div>

            <div
                id="studentsContent"
            >

                <div class="loading">

                    Loading students...

                </div>

            </div>

        </div>


    </main>


    <!-- ==========================================
         FIREBASE
         =========================================== -->

    <script type="module">


        /* ==========================================
           IMPORT FIREBASE
           =========================================== */

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
        from
        "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";


        import {
            getDatabase,
            ref,
            get,
            query,
            orderByChild,
            equalTo
        }
        from
        "https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js";


        /* ==========================================
           FIREBASE CONFIG
           
           REPLACE WITH YOUR FIREBASE CONFIG
           ========================================== */

        const firebaseConfig = {

            apiKey:
                "YOUR_API_KEY",

            authDomain:
                "YOUR_PROJECT.firebaseapp.com",

            databaseURL:
                "YOUR_DATABASE_URL",

            projectId:
                "YOUR_PROJECT_ID",

            storageBucket:
                "YOUR_PROJECT.firebasestorage.app",

            messagingSenderId:
                "YOUR_MESSAGING_SENDER_ID",

            appId:
                "YOUR_APP_ID"

        };


        /* ==========================================
           INITIALIZE
           ========================================== */

        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getDatabase(app);


        /* ==========================================
           DOM
           ========================================== */

        const roleBadge =
            document.getElementById(
                "roleBadge"
            );


        const welcomeTitle =
            document.getElementById(
                "welcomeTitle"
            );


        const welcomeDescription =
            document.getElementById(
                "welcomeDescription"
            );


        const profileGrid =
            document.getElementById(
                "profileGrid"
            );


        const studentsSection =
            document.getElementById(
                "studentsSection"
            );


        const studentsTitle =
            document.getElementById(
                "studentsTitle"
            );


        const studentsContent =
            document.getElementById(
                "studentsContent"
            );


        const studentCount =
            document.getElementById(
                "studentCount"
            );

const studentSearch =
    document.getElementById(
        "studentSearch"
    );

const searchBtn =
    document.getElementById(
        "searchBtn"
    );

const clearSearchBtn =
    document.getElementById(
        "clearSearchBtn"
    );

const searchResultInfo =
    document.getElementById(
        "searchResultInfo"
    );
        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        /* ==========================================
           ROLE NAMES
           ========================================== */

        const roleNames = {

            student: "Student",

            coordinator: "Coordinator",

            hod: "HOD",

            principal: "Principal"

        };


        /* ==========================================
           AUTH STATE
           ========================================== */

        onAuthStateChanged(
            auth,
            async (user) => {


                /* ==============================
                   NOT LOGGED IN
                   ============================== */

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                /* ==============================
                   LOAD USER
                   ============================== */

                try {

                    await loadDashboard(
                        user
                    );

                }

                catch (error) {

                    console.error(
                        error
                    );

                    showError(
                        "Unable to load dashboard."
                    );

                }

            }
        );


        /* ==========================================
           LOAD DASHBOARD
           ========================================== */

        async function loadDashboard(
            user
        ) {


            /* ======================================
               GET CURRENT USER PROFILE
               ======================================= */

            const userSnapshot =
                await get(
                    ref(
                        db,
                        "users/" + user.uid
                    )
                );


            if (
                !userSnapshot.exists()
            ) {

                await signOut(auth);

                window.location.href =
                    "login.html";

                return;

            }


            const userData =
                userSnapshot.val();


            const role =
                String(
                    userData.role || ""
                )
                .trim()
                .toLowerCase();


            /* ======================================
               CHECK VALID ROLE
               ======================================= */

            if (
                ![
                    "student",
                    "coordinator",
                    "hod",
                    "principal"
                ].includes(role)
            ) {

                showError(
                    "Invalid user role."
                );

                return;

            }


            /* ======================================
               NAVBAR
               ======================================= */

            roleBadge.textContent =
                roleNames[role];


            /* ======================================
               WELCOME
               ======================================= */

            const name =
                userData.name ||
                roleNames[role];


            welcomeTitle.textContent =
                `Welcome, ${name}`;


            /* ======================================
               LOAD PROFILE
               ======================================= */

            displayProfile(
                userData,
                role
            );


            /* ======================================
               ROLE-SPECIFIC DASHBOARD
               ======================================= */


            /* --------------------------------------
               STUDENT
               -------------------------------------- */

            if (
                role === "student"
            ) {

                await studentDashboard(
                    userData
                );

            }


            /* --------------------------------------
               COORDINATOR
               -------------------------------------- */

            else if (
                role === "coordinator"
            ) {

                await coordinatorDashboard(
                    userData
                );

            }


            /* --------------------------------------
               HOD
               -------------------------------------- */

            else if (
                role === "hod"
            ) {

                await hodDashboard(
                    userData
                );

            }


            /* --------------------------------------
               PRINCIPAL
               -------------------------------------- */

            else if (
                role === "principal"
            ) {

                await principalDashboard();

            }

        }


        /* ==========================================
           DISPLAY PROFILE
           ========================================== */

        function displayProfile(
            data,
            role
        ) {


            let html = "";


            /* STUDENT */

            if (
                role === "student"
            ) {

                html += profileItem(
                    "Name",
                    data.name
                );

                html += profileItem(
                    "Roll Number",
                    data.rollNumber
                );

                html += profileItem(
                    "Branch",
                    data.branch
                );

                html += profileItem(
                    "Section",
                    data.section
                );

                html += profileItem(
                    "Email",
                    data.email
                );

                html += profileItem(
                    "Coding Platform",
                    data.codingLink
                        ? `<a class="coding-link" href="${escapeAttribute(data.codingLink)}" target="_blank">View Profile</a>`
                        : "Not provided"
                );

            }


            /* COORDINATOR */

            else if (
                role === "coordinator"
            ) {

                html += profileItem(
                    "Email",
                    data.email
                );

                html += profileItem(
                    "Branch",
                    data.branch
                );

                html += profileItem(
                    "Section",
                    data.section
                );

            }


            /* HOD */

            else if (
                role === "hod"
            ) {

                html += profileItem(
                    "Email",
                    data.email
                );

                html += profileItem(
                    "Branch",
                    data.branch
                );

            }


            /* PRINCIPAL */

            else if (
                role === "principal"
            ) {

                html += profileItem(
                    "Email",
                    data.email
                );

                html += profileItem(
                    "Role",
                    "Principal"
                );

            }


            profileGrid.innerHTML =
                html;

        }


        /* ==========================================
           PROFILE ITEM
           ========================================== */

        function profileItem(
            label,
            value
        ) {

            return `

                <div class="profile-item">

                    <div class="label">
                        ${label}
                    </div>

                    <div class="value">
                        ${value || "Not provided"}
                    </div>

                </div>

            `;

        }


        /* ==========================================
           STUDENT DASHBOARD
           ========================================== */

        async function studentDashboard(
            userData
        ) {


            welcomeDescription.textContent =
                "You can view only your personal information.";


            studentsTitle.textContent =
                "My Information";


            studentCount.textContent =
                "1 Student";


            /*
             * STUDENT SHOULD NOT SEE
             * OTHER STUDENTS.
             */

            studentsContent.innerHTML = `

                <div class="empty">

                    You are logged in as a Student.
                    <br><br>

                    Only your personal data is visible.

                </div>

            `;

        }


        /* ==========================================
           COORDINATOR DASHBOARD
           ========================================== */

        async function coordinatorDashboard(
            coordinatorData
        ) {


            welcomeDescription.textContent =

                `Showing students from ${coordinatorData.branch || ""} - Section ${coordinatorData.section || ""}.`;


            studentsTitle.textContent =
                "My Class Students";


            /* ======================================
               CHECK BRANCH + SECTION
               ======================================= */

            if (
                !coordinatorData.branch ||
                !coordinatorData.section
            ) {

                studentsContent.innerHTML = `

                    <div class="empty">

                        Coordinator branch or section
                        is not configured.

                    </div>

                `;

                return;

            }


            /* ======================================
               QUERY STUDENTS
               ======================================= */

            const studentsQuery =
                query(

                    ref(
                        db,
                        "users"
                    ),

                    orderByChild(
                        "branch"
                    ),

                    equalTo(
                        coordinatorData.branch
                    )

                );


            const snapshot =
                await get(
                    studentsQuery
                );


            const students = [];


            if (
                snapshot.exists()
            ) {

                snapshot.forEach(
                    child => {

                        const student =
                            child.val();


                        /*
                         * ONLY STUDENTS
                         */

                        if (

                            student.role ===
                                "student"

                            &&

                            String(
                                student.section
                            ).toLowerCase() ===
                            String(
                                coordinatorData.section
                            ).toLowerCase()

                        ) {

                            students.push({
                                id:
                                    child.key,

                                ...student

                            });

                        }

                    }
                );

            }


            displayStudents(
                students
            );

        }


        /* ==========================================
           HOD DASHBOARD
           ========================================== */

        async function hodDashboard(
            hodData
        ) {


            welcomeDescription.textContent =

                `Showing all students from the ${hodData.branch || ""} branch across all sections.`;


            studentsTitle.textContent =
                "All Students in My Branch";


            /* ======================================
               CHECK BRANCH
               ======================================= */

            if (
                !hodData.branch
            ) {

                studentsContent.innerHTML = `

                    <div class="empty">

                        HOD branch is not configured.

                    </div>

                `;

                return;

            }


            /* ======================================
               QUERY BRANCH
               ======================================= */

            const studentsQuery =
                query(

                    ref(
                        db,
                        "users"
                    ),

                    orderByChild(
                        "branch"
                    ),

                    equalTo(
                        hodData.branch
                    )

                );


            const snapshot =
                await get(
                    studentsQuery
                );


            const students = [];


            if (
                snapshot.exists()
            ) {

                snapshot.forEach(
                    child => {

                        const student =
                            child.val();


                        if (
                            student.role ===
                            "student"
                        ) {

                            students.push({

                                id:
                                    child.key,

                                ...student

                            });

                        }

                    }
                );

            }


            displayStudents(
                students
            );

        }


        /* ==========================================
           PRINCIPAL DASHBOARD
           ========================================== */

        async function principalDashboard()
        {


            welcomeDescription.textContent =
                "Showing all registered students across all branches and sections.";


            studentsTitle.textContent =
                "All Students";


            /* ======================================
               GET ALL USERS
               ======================================= */

            const snapshot =
                await get(
                    ref(
                        db,
                        "users"
                    )
                );


            const students = [];


            if (
                snapshot.exists()
            ) {

                snapshot.forEach(
                    child => {

                        const user =
                            child.val();


                        if (
                            user.role ===
                            "student"
                        ) {

                            students.push({

                                id:
                                    child.key,

                                ...user

                            });

                        }

                    }
                );

            }

let currentStudents = [];
            function displayStudents(students) {

    // Store the students that the current role is allowed to see
    currentStudents = [...students];

    renderStudents(currentStudents);

}
            function renderStudents(students) {

    studentCount.textContent =
        `${students.length} Student${students.length !== 1 ? "s" : ""}`;

    if (students.length === 0) {

        studentsContent.innerHTML = `

            <div class="empty">

                No students found.

            </div>

        `;

        return;
    }

    /* ======================================
       SORT BY ROLL NUMBER
       ======================================= */

    students.sort(
        (a, b) =>
            String(
                a.rollNumber || ""
            ).localeCompare(
                String(
                    b.rollNumber || ""
                )
            )
    );

    let html = `

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Name</th>

                        <th>Roll Number</th>

                        <th>Branch</th>

                        <th>Section</th>

                        <th>Email</th>

                        <th>Coding Profile</th>

                    </tr>

                </thead>

                <tbody>

    `;

    students.forEach(
        (student, index) => {

            let codingProfile =
                "Not provided";

            if (student.codingLink) {

                codingProfile = `

                    <a
                        class="coding-link"
                        href="${escapeAttribute(student.codingLink)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        View Profile
                    </a>

                `;

            }

            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHtml(
                            student.name || "N/A"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            student.rollNumber || "N/A"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            student.branch || "N/A"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            student.section || "N/A"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            student.email || "N/A"
                        )}
                    </td>

                    <td>
                        ${codingProfile}
                    </td>

                </tr>

            `;

        }
    );

    html += `

                </tbody>

            </table>

        </div>

    `;

    studentsContent.innerHTML = html;

}
            function searchStudents() {

    const searchText =
        studentSearch.value
            .trim()
            .toLowerCase();

    // If search box is empty, show all students
    if (!searchText) {

        searchResultInfo.textContent = "";

        renderStudents(
            [...currentStudents]
        );

        return;
    }

    /*
     * Search only by student NAME.
     *
     * Example:
     * "ch"      → Ch.Yasodha Rani
     * "y"       → Yasodha Rani
     * "yasodha" → Ch.Yasodha Rani
     */

    const matchedStudents =
        currentStudents.filter(
            student => {

                const name =
                    String(
                        student.name || ""
                    ).toLowerCase();

                return name.includes(
                    searchText
                );

            }
        );

    searchResultInfo.textContent =
        `Found ${matchedStudents.length} student${
            matchedStudents.length !== 1
                ? "s"
                : ""
        } matching "${studentSearch.value}"`;

    renderStudents(
        [...matchedStudents]
    );

}


        /* ==========================================
           DISPLAY STUDENTS
           ========================================== */

        function displayStudents(
            students
        ) {


            studentCount.textContent =

                `${students.length} Student${students.length !== 1 ? "s" : ""}`;


            if (
                students.length === 0
            ) {

                studentsContent.innerHTML = `

                    <div class="empty">

                        No students found.

                    </div>

                `;

                return;

            }


            /* ======================================
               SORT BY ROLL NUMBER
               ======================================= */

            students.sort(
                (a, b) =>

                    String(
                        a.rollNumber || ""
                    ).localeCompare(
                        String(
                            b.rollNumber || ""
                        )
                    )
            );


            let html = `

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    #
                                </th>

                                <th>
                                    Name
                                </th>

                                <th>
                                    Roll Number
                                </th>

                                <th>
                                    Branch
                                </th>

                                <th>
                                    Section
                                </th>

                                <th>
                                    Email
                                </th>

                                <th>
                                    Coding Profile
                                </th>

                            </tr>

                        </thead>

                        <tbody>

            `;


            students.forEach(
                (student, index) => {


                    let codingProfile =
                        "Not provided";


                    if (
                        student.codingLink
                    ) {

                        codingProfile = `

                            <a
                                class="coding-link"
                                href="${escapeAttribute(student.codingLink)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                View Profile
                            </a>

                        `;

                    }


                    html += `

                        <tr>

                            <td>
                                ${index + 1}
                            </td>

                            <td>
                                ${escapeHtml(student.name || "N/A")}
                            </td>

                            <td>
                                ${escapeHtml(student.rollNumber || "N/A")}
                            </td>

                            <td>
                                ${escapeHtml(student.branch || "N/A")}
                            </td>

                            <td>
                                ${escapeHtml(student.section || "N/A")}
                            </td>

                            <td>
                                ${escapeHtml(student.email || "N/A")}
                            </td>

                            <td>
                                ${codingProfile}
                            </td>

                        </tr>

                    `;

                }
            );


            html += `

                        </tbody>

                    </table>

                </div>

            `;


            studentsContent.innerHTML =
                html;

        }


        /* ==========================================
           ESCAPE HTML
           ========================================== */

        function escapeHtml(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ==========================================
           ESCAPE ATTRIBUTE
           ========================================== */

        function escapeAttribute(
            value
        ) {

            return String(value)
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ==========================================
           ERROR
           ========================================== */

        function showError(
            text
        ) {

            studentsContent.innerHTML = `

                <div class="access-denied">

                    ${escapeHtml(text)}

                </div>

            `;

        }


        /* ==========================================
           LOGOUT
           ========================================== */

        logoutBtn.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "login.html";

                }

                catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                }

            }
        );
