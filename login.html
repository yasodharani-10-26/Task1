
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Academic Management System</title>

  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }


    /* =====================================================
       BODY
       ===================================================== */

    body {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1e3a8a,
          #312e81
        );

    }


    /* =====================================================
       LOGIN CARD
       ===================================================== */

    .login-container {

      width: 100%;

      max-width: 430px;

      background: rgba(255, 255, 255, 0.96);

      border-radius: 20px;

      padding: 35px;

      box-shadow:
        0 25px 60px
        rgba(0, 0, 0, 0.30);

      animation:
        fadeIn 0.5s ease;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      text-align: center;

      margin-bottom: 28px;

    }


    .header h1 {

      font-size: 28px;

      color: #172554;

      margin-bottom: 8px;

    }


    .header p {

      color: #64748b;

      font-size: 14px;

    }


    /* =====================================================
       ROLE SELECTOR
       ===================================================== */

    .role-title {

      font-size: 14px;

      font-weight: bold;

      color: #334155;

      margin-bottom: 10px;

    }


    .role-selector {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-bottom: 25px;

    }


    .role-option {

      border: 2px solid #e2e8f0;

      border-radius: 12px;

      padding: 13px 10px;

      background: #f8fafc;

      cursor: pointer;

      text-align: center;

      transition: all 0.25s ease;

      color: #475569;

      font-size: 14px;

      font-weight: 600;

    }


    .role-option:hover {

      border-color: #6366f1;

      color: #4338ca;

    }


    .role-option.active {

      background: #eef2ff;

      border-color: #4f46e5;

      color: #4338ca;

    }


    .role-icon {

      display: block;

      font-size: 23px;

      margin-bottom: 5px;

    }


    /* =====================================================
       FORM
       ===================================================== */

    .form-group {

      margin-bottom: 18px;

    }


    .form-group label {

      display: block;

      font-size: 14px;

      font-weight: 600;

      color: #334155;

      margin-bottom: 8px;

    }


    .input-wrapper {

      position: relative;

    }


    input {

      width: 100%;

      padding: 14px 15px;

      border: 1px solid #cbd5e1;

      border-radius: 10px;

      outline: none;

      font-size: 14px;

      color: #1e293b;

      background: white;

      transition: 0.2s;

    }


    input:focus {

      border-color: #4f46e5;

      box-shadow:
        0 0 0 3px
        rgba(79, 70, 229, 0.12);

    }


    input.password-input {

      padding-right: 48px;

    }


    /* =====================================================
       PASSWORD BUTTON
       ===================================================== */

    .password-toggle {

      position: absolute;

      right: 12px;

      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      cursor: pointer;

      font-size: 18px;

      color: #64748b;

    }


    /* =====================================================
       LOGIN BUTTON
       ===================================================== */

    .login-btn {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #2563eb
        );

      color: white;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.25s;

      margin-top: 5px;

    }


    .login-btn:hover {

      transform: translateY(-1px);

      box-shadow:
        0 8px 20px
        rgba(37, 99, 235, 0.30);

    }


    .login-btn:disabled {

      opacity: 0.6;

      cursor: not-allowed;

      transform: none;

    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    #message {

      display: none;

      padding: 12px;

      margin-bottom: 18px;

      border-radius: 9px;

      text-align: center;

      font-size: 13px;

      font-weight: 500;

    }


    #message.success {

      display: block;

      background: #dcfce7;

      color: #166534;

      border: 1px solid #86efac;

    }


    #message.error {

      display: block;

      background: #fee2e2;

      color: #991b1b;

      border: 1px solid #fca5a5;

    }


    #message.info {

      display: block;

      background: #dbeafe;

      color: #1e40af;

      border: 1px solid #93c5fd;

    }


    /* =====================================================
       REGISTER
       ===================================================== */

    .register-section {

      text-align: center;

      margin-top: 22px;

      color: #64748b;

      font-size: 14px;

    }


    .register-section a {

      color: #4f46e5;

      font-weight: 600;

      text-decoration: none;

    }


    .register-section a:hover {

      text-decoration: underline;

    }


    /* =====================================================
       SELECTED ROLE TEXT
       ===================================================== */

    .selected-role {

      text-align: center;

      margin-bottom: 20px;

      font-size: 14px;

      color: #475569;

    }


    .selected-role span {

      color: #4338ca;

      font-weight: 700;

    }


    /* =====================================================
       ANIMATION
       ===================================================== */

    @keyframes fadeIn {

      from {

        opacity: 0;

        transform: translateY(15px);

      }

      to {

        opacity: 1;

        transform: translateY(0);

      }

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 480px) {

      .login-container {

        padding: 25px 20px;

      }

      .header h1 {

        font-size: 24px;

      }

      .role-option {

        padding: 11px 6px;

        font-size: 13px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LOGIN CONTAINER
       ===================================================== -->

  <div class="login-container">


    <!-- HEADER -->

    <div class="header">

      <h1>Welcome Back</h1>

      <p>
        Sign in to access your account
      </p>

    </div>


    <!-- ===================================================
         ROLE SELECTION
         =================================================== -->

    <div class="role-title">

      Select Your Role

    </div>


    <div class="role-selector">


      <!-- STUDENT -->

      <div
        class="role-option"
        data-role="student"
      >

        <span class="role-icon">
          🎓
        </span>

        Student

      </div>


      <!-- COORDINATOR -->

      <div
        class="role-option"
        data-role="coordinator"
      >

        <span class="role-icon">
          👨‍🏫
        </span>

        Coordinator

      </div>


      <!-- HOD -->

      <div
        class="role-option"
        data-role="hod"
      >

        <span class="role-icon">
          👨‍💼
        </span>

        HOD

      </div>


      <!-- PRINCIPAL -->

      <div
        class="role-option"
        data-role="principal"
      >

        <span class="role-icon">
          👔
        </span>

        Principal

      </div>


    </div>


    <!-- SELECTED ROLE -->

    <div
      class="selected-role"
      id="selectedRoleText"
    >

      Please select your role

    </div>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- ===================================================
         LOGIN FORM
         =================================================== -->

    <form
      id="loginForm"
      novalidate
    >


      <!-- EMAIL -->

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label for="password">
          Password
        </label>


        <div class="input-wrapper">

          <input
            type="password"
            id="password"
            class="password-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >


          <button
            type="button"
            id="passwordToggle"
            class="password-toggle"
            aria-label="Show password"
          >

            👁️

          </button>

        </div>

      </div>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        id="loginButton"
        class="login-btn"
      >

        Login

      </button>


    </form>


    <!-- REGISTER -->

    <div class="register-section">

      Don't have an account?

      <a href="register.html">
        Register
      </a>

    </div>


  </div>


  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script type="module">


    /* =====================================================
       FIREBASE IMPORTS
       ===================================================== */

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    }
    from
      "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";


    import {
      getDatabase,
      ref,
      get
    }
    from
      "https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js";


    /* =====================================================
       FIREBASE CONFIGURATION

       IMPORTANT:
       Replace these values with YOUR project's
       Firebase configuration.
       ===================================================== */

    const firebaseConfig = {

      apiKey:
        "YOUR_API_KEY",

      authDomain:
        "YOUR_PROJECT.firebaseapp.com",

      databaseURL:
        "YOUR_DATABASE_URL",

      projectId:
        "YOUR_PROJECT_ID",

      storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

      messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

      appId:
        "YOUR_APP_ID"

    };


    /* =====================================================
       INITIALIZE FIREBASE
       ===================================================== */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getDatabase(app);


    /* =====================================================
       DOM ELEMENTS
       ===================================================== */

    const roleOptions =
      document.querySelectorAll(
        ".role-option"
      );


    const selectedRoleText =
      document.getElementById(
        "selectedRoleText"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const passwordToggle =
      document.getElementById(
        "passwordToggle"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    /* =====================================================
       CURRENT SELECTED ROLE
       ===================================================== */

    let selectedRole = "";


    /* =====================================================
       ROLE DISPLAY NAMES
       ===================================================== */

    const roleNames = {

      student:
        "Student",

      coordinator:
        "Coordinator",

      hod:
        "HOD",

      principal:
        "Principal"

    };


    /* =====================================================
       ROLE DASHBOARDS
       ===================================================== */
const dashboardPages = {
    student: "dashboard.html",
    coordinator: "dashboard.html",
    hod: "dashboard.html",
    principal: "dashboard.html"
};


    /* =====================================================
       SELECT ROLE
       ===================================================== */

    roleOptions.forEach(option => {


      option.addEventListener(
        "click",
        () => {


          /* Remove active from all */

          roleOptions.forEach(item => {

            item.classList.remove(
              "active"
            );

          });


          /* Activate selected */

          option.classList.add(
            "active"
          );


          /* Store selected role */

          selectedRole =
            option.dataset.role;


          /* Update text */

          selectedRoleText.innerHTML =

            `Logging in as
            <span>
              ${roleNames[selectedRole]}
            </span>`;


          /* Clear old message */

          clearMessage();

        }
      );

    });


    /* =====================================================
       PASSWORD SHOW / HIDE
       ===================================================== */

    passwordToggle.addEventListener(
      "click",
      () => {


        if (
          passwordInput.type ===
          "password"
        ) {

          passwordInput.type =
            "text";

          passwordToggle.textContent =
            "🙈";

          passwordToggle.setAttribute(
            "aria-label",
            "Hide password"
          );

        }

        else {

          passwordInput.type =
            "password";

          passwordToggle.textContent =
            "👁️";

          passwordToggle.setAttribute(
            "aria-label",
            "Show password"
          );

        }

      }
    );


    /* =====================================================
       MESSAGE FUNCTIONS
       ===================================================== */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        type;

      message.style.display =
        "block";

    }


    function clearMessage() {

      message.textContent =
        "";

      message.className =
        "";

      message.style.display =
        "none";

    }


    /* =====================================================
       LOGIN FORM
       ===================================================== */

    loginForm.addEventListener(
      "submit",
      async (event) => {


        event.preventDefault();


        clearMessage();


        /* ================================================
           CHECK ROLE
           ================================================ */

        if (!selectedRole) {

          showMessage(
            "Please select your role first.",
            "error"
          );

          return;

        }


        /* ================================================
           GET INPUTS
           ================================================ */

        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        /* ================================================
           BASIC VALIDATION
           ================================================ */

        if (!email) {

          showMessage(
            "Please enter your email address.",
            "error"
          );

          emailInput.focus();

          return;

        }


        if (!password) {

          showMessage(
            "Please enter your password.",
            "error"
          );

          passwordInput.focus();

          return;

        }


        /* ================================================
           LOADING
           ================================================ */

        loginButton.disabled =
          true;

        loginButton.textContent =
          "Signing in...";


        try {


          /* ==============================================
             STEP 1
             FIREBASE AUTHENTICATION
             ============================================== */

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          console.log(
            "Authenticated UID:",
            user.uid
          );


          /* ==============================================
             STEP 2
             GET USER PROFILE
             ============================================== */

          const userRef =
            ref(
              db,
              "users/" + user.uid
            );


          const snapshot =
            await get(userRef);


          /* ==============================================
             PROFILE NOT FOUND
             ============================================== */

          if (!snapshot.exists()) {


            await signOut(auth);


            showMessage(
              "User profile was not found. Please contact the administrator.",
              "error"
            );


            resetLoginButton();


            return;

          }


          /* ==============================================
             STEP 3
             READ USER DATA
             ============================================== */

          const userData =
            snapshot.val();


          console.log(
            "User data:",
            userData
          );


          /* ==============================================
             STEP 4
             GET REGISTERED ROLE
             ============================================== */

          const registeredRole =
            String(
              userData.role || ""
            )
            .trim()
            .toLowerCase();


          /* ==============================================
             ROLE NOT FOUND
             ============================================== */

          if (!registeredRole) {


            await signOut(auth);


            showMessage(
              "Your account does not have a registered role.",
              "error"
            );


            resetLoginButton();


            return;

          }


          /* ==============================================
             STEP 5
             ROLE VERIFICATION
             ============================================== */

          if (
            registeredRole !==
            selectedRole
          ) {


            /*
             * VERY IMPORTANT:
             * Sign the user out if they selected
             * the wrong role.
             */

            await signOut(auth);


            showMessage(

              `Access denied. This account is registered as ${roleNames[registeredRole] || registeredRole}, not ${roleNames[selectedRole]}.`,

              "error"

            );


            resetLoginButton();


            return;

          }


          /* ==============================================
             STEP 6
             SUCCESS
             ============================================== */

          showMessage(

            `Login successful! Welcome, ${roleNames[selectedRole]}.`,

            "success"

          );


          loginButton.textContent =
            "Login Successful";


          /* ==============================================
             STEP 7
             DASHBOARD REDIRECTION
             ============================================== */

          const dashboard =
            dashboardPages[
              selectedRole
            ];


          if (!dashboard) {


            await signOut(auth);


            showMessage(
              "Dashboard configuration not found.",
              "error"
            );


            resetLoginButton();


            return;

          }


          setTimeout(
            () => {

              window.location.href =
                dashboard;

            },
            1000
          );


        }


        /* ================================================
           FIREBASE ERROR
           ================================================ */

        catch (error) {


          console.error(
            "Login Error:",
            error.code,
            error.message
          );


          resetLoginButton();


          switch (
            error.code
          ) {


            case
              "auth/invalid-credential":

              showMessage(
                "Invalid email or password.",
                "error"
              );

              break;


            case
              "auth/invalid-login-credentials":

              showMessage(
                "Invalid email or password.",
                "error"
              );

              break;


            case
              "auth/user-not-found":

              showMessage(
                "No account found with this email address.",
                "error"
              );

              break;


            case
              "auth/wrong-password":

              showMessage(
                "Incorrect password.",
                "error"
              );

              break;


            case
              "auth/invalid-email":

              showMessage(
                "Please enter a valid email address.",
                "error"
              );

              break;


            case
              "auth/too-many-requests":

              showMessage(
                "Too many login attempts. Please try again later.",
                "error"
              );

              break;


            case
              "auth/network-request-failed":

              showMessage(
                "Network error. Please check your internet connection.",
                "error"
              );

              break;


            case
              "auth/user-disabled":

              showMessage(
                "This account has been disabled.",
                "error"
              );

              break;


            default:

              showMessage(
                "Login failed. Please try again.",
                "error"
              );

              break;

          }

        }

      }
    );


    /* =====================================================
       RESET LOGIN BUTTON
       ===================================================== */

    function resetLoginButton() {

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }

window.location.href = "dashboard.html";
  </script>
</body>

</html>
